<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>潜る Moguru PDF Reader</title>
  <link rel="stylesheet" href="content.css">
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 0; background: #3c4148; }
    #toolbar {
      position: sticky; top: 0; z-index: 10; background: #26292e; color: #eee;
      padding: 8px 14px; display: flex; gap: 12px; align-items: center;
    }
    #toolbar button { background: #3c4148; color: #eee; border: 1px solid #555;
      border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    #pages { max-width: 900px; margin: 0 auto; padding: 16px; }
    .page { background: white; margin: 0 auto 18px; position: relative;
      box-shadow: 0 2px 12px rgba(0,0,0,.4); isolation: isolate; }
    .page canvas { display: block; }
    .page .textLayer { position: absolute; inset: 0; overflow: hidden;
      line-height: 1; text-align: initial; text-size-adjust: none;
      forced-color-adjust: none; transform-origin: 0 0; }
    /* pdf.js text layer: transparent glyphs used only for selection. Banded
       spans get COLOR of their own — the text layer renders the colored
       glyphs precisely over the canvas ones (color the text, not a box). */
    .page .textLayer span { position: absolute; white-space: pre;
      transform-origin: 0 0; color: transparent; cursor: default;
      line-height: 1; }
    /* PDF glyphs are burnt-in canvas pixels — they cannot be recolored
       reliably (font substitution drifts = ghost copies). Bands render as
       colored underlines pinned to the PDF's declared run geometry instead:
       font-independent, ghost-proof. Web pages keep colored text. */
    .page .textLayer span.moguru-tok {
      border-bottom: 3px solid var(--moguru-hard-color);
    }
    .page .textLayer span.moguru-iplus { border-bottom-color: var(--moguru-iplus-color); }
    .page .textLayer span.moguru-new_hard { border-bottom-color: var(--moguru-hard-color); }
    .page .textLayer span.moguru-known_unstable {
      border-bottom: 3px dotted var(--moguru-unstable-color);
    }
    .page .textLayer span[data-furigana] { pointer-events: none; }
    /* Glyph tinting (official TextLayer only): banded runs are split into
       per-token spans and the WHOLE layer is screen-blended over the canvas —
       black × screen(color) = the color, white paper untouched, transparent
       text a no-op. The burnt-in kanji itself takes the band color with zero
       ghost copies. Layer-level blending (not per-span: pdf.js fit-transforms
       spans, and transforms isolate). The font-substituted manual fallback
       keeps the underlines above instead. */
    .page .textLayer.tinted { mix-blend-mode: screen; }
    /* selection paint inside a screen-blended layer: dark translucent shows
       up as a light wash on paper (screen would erase pure highlight colors) */
    .page .textLayer.tinted span::selection { background: rgba(0, 0, 0, 0.15); }
    .page .textLayer.tinted span.moguru-tok { border-bottom: none; }
    .page .textLayer.tinted span.moguru-iplus { color: var(--moguru-iplus-color); }
    .page .textLayer.tinted span.moguru-new_hard { color: var(--moguru-hard-color); }
    .page .textLayer.tinted span.moguru-known_unstable {
      color: var(--moguru-unstable-color);
    }
    /* Alt+M band toggle (original view AND text view) */
    .moguru-tok.moguru-bands-off {
      border-bottom: none !important;
      color: transparent !important;
      mix-blend-mode: normal !important;
    }
    .moguru-pop { position: fixed; }
    /* Text view: the page's own text re-typeset — colored glyphs are real
       DOM text here, so banding is pixel-perfect by construction. */
    .textpage {
      background: white; max-width: 720px; margin: 0 auto 18px;
      padding: 28px 34px; box-shadow: 0 2px 12px rgba(0,0,0,.4);
      font-size: 19px; line-height: 2.1; color: #1a1a1a;
      letter-spacing: .02em;
    }
    .textpage p { margin: 0 0 1.1em; }
    .textpage .pgnum { color: #999; font-size: 12px; text-align: center; }
    /* 縦書き — traditional vertical writing. Text flows top→bottom, columns
       right→left; underlines/color bands automatically sit on the correct
       side of each column. */
    #textpages.vertical .textpage {
      writing-mode: vertical-rl;
      height: 92vh;
      max-width: none;
      width: max-content;
      margin: 0 24px 24px auto;
      padding: 30px 26px;
      font-size: 20px;
      line-height: 2.3;
      letter-spacing: .06em;
    }
    #textpages.vertical .textpage .pgnum {
      writing-mode: horizontal-tb;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <b>潜る PDF reader</b>
    <input type="file" id="file" accept="application/pdf">
    <button id="viewToggle">テキスト表示</button>
    <button id="writingMode" style="display:none">縦書き</button>
    <button id="toggle">toggle bands (Alt+M)</button>
    <span id="hint" style="opacity:.7; font-size:12px">
      click a word: explain / Anki / mark known
    </span>
  </div>
  <div id="pages"></div>
  <div id="textpages" style="display:none"></div>
  <script type="module" src="reader.js"></script>
</body>
</html>
